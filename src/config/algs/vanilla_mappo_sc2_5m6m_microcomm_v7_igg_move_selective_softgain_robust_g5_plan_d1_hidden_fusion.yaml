# --- v7 Plan D1: Hidden-State Fusion — Minimal Verification ---
#
# Moves the communication injection point from logit-space to hidden-state.
# Single-stream (attack only, move disabled). Scalar gate with annealing.
#
# Key change from C series:
#   logit level:  fused = local + 0.004 × delta  (comm never influences decisions)
#   hidden level: h_fused = (1-gate) × h_local + gate × h_comm
#                 logits = policy_head(h_fused)
#
# Gate schedule (conservative):
#   0-300k:    gate=0, h_fused=h_local (pure backbone)
#   300-800k:  gate 0→0.2 (gradient slowly enters comm_head)
#   800k+:     gate=0.2 (20% hidden state from communication)
#
# Critical logging:
#   hidden_fusion_cosine: cosine(h_fused, h_local). <0.95 = comm affects representation

