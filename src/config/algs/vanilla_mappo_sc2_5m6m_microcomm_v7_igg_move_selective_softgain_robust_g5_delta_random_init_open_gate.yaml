# --- v7-IGG G5: Break cold-start deadlock (A+D approach, v2) ---
#
# Changes from G4_fixed:
#   Fix A1: delta_zero_init OFF — delta starts with normal random init
#   Fix A2: attack_gate_init_bias 0.0 (was -2.5) — gate starts ~0.51
#   Fix A3: move_gate_init_bias 0.0 (was -3.0) — symmetric with attack
#   Fix A4: attack delta L2-normalized (code change) — matches move delta,
#           prevents delta from exploding and dominating backbone
#   Fix D:  overpredict weights already 0 in G4 (not re-added)
#
# Rationale:
#   G5 v1 had attack delta explode to norm=116 (no L2 constraint),
#   drowning backbone gradient (actor_grad_norm 55→0.21) and flipping
#   36% of actions. Move delta was locked at norm=1 by L2 norm but
#   gate stayed closed due to low init_bias (-1.0). v2 fixes both:
#   attack delta L2-normalized like move, both gate biases at 0.0.
#
# Kept from G4: soft_weighting OFF, gain_norm OFF,
#   bidirectional move_no_comm_loss, attack_temperature 1.0,
#   topk=1, weight_decay removed, advantage_clip removed, gae_lambda 0.95

action_selector: "multinomial"
epsilon_start: 0.0
epsilon_finish: 0.0
epsilon_anneal_time: 1
test_greedy: True

runner: "parallel_local_safe"
batch_size_run: 4
env_reset_stagger_sec: 0.0

buffer_size: 8
batch_size: 8
burn_in_period: 8
num_circle: 1

agent_output_type: "pi_logits"
mask_before_softmax: True
learner: "mappo_agentwise_centralized_officialish_learner"
mac: "maic_mac"
agent: "vanilla_mappo_microcomm_dualstream_counterfactual_usegate"

rnn_hidden_dim: 64

attention_dim: 16
attention_heads: 1
comm_value_dim: 8
comm_topk: 1
move_comm_value_dim: 8
move_comm_topk: 2
attack_attn_temperature: 1.0
log_attention_maps: False
comm_detach_backbone: False
comm_lr_multiplier: 1.0
attention_entropy_loss_weight: 0.0

comm_warmup_delay_steps: 0
comm_warmup_steps: 0
comm_warmup_start_factor: 1.0
comm_warmup_end_factor: 1.0
move_readiness_warmup: False

semantic_action_offset: 6
relation_feature_indices: [0, 1, 2, 3, 4]
targeted_sender_state_dim: 2
use_no_comm_token: True
intent_detach: False
intent_mask_unavailable: True

attack_fusion_scale: 0.1
attack_gate_init_bias: 0.0
attack_gate_floor: 0.02
attack_gate_activation: "sigmoid"
attack_gate_softplus_beta: 1.0
attack_gate_scale: 1.0
attack_delta_zero_init: False
attack_no_comm_score_penalty: 0.3

move_self_feature_indices: [0]
move_carrier_mode: "semantic_threat"
move_enemy_visible_index: 0
move_enemy_distance_index: 1
move_ally_visible_index: 0
move_ally_distance_index: 1
move_fusion_scale: 0.06
move_gate_init_bias: 0.0
move_gate_floor: 0.04
move_gate_max: 0.6
move_gate_activation: "sigmoid"
move_gate_softplus_beta: 1.0
move_gate_scale: 1.0
move_delta_zero_init: False
move_distance_penalty_coef: 0.0
move_distance_relation_index: 1

move_attn_temperature: 0.85
move_entropy_target: 0.58
move_entropy_upper_only: True
move_entropy_target_loss_weight: 0.02
move_no_comm_target: 0.65
move_no_comm_target_loss_weight: 0.05
no_comm_budget: 0.3
no_comm_budget_loss_weight: 0.03

counterfactual_usegate: True
counterfactual_usegate_gain_temp: 0.1
counterfactual_usegate_attack_loss_weight: 0.05
counterfactual_usegate_move_loss_weight: 0.08
counterfactual_usegate_attack_sparsity_weight: 0.005
counterfactual_usegate_move_sparsity_weight: 0.001

critic_use_local_obs: True
critic_use_last_action: True
critic_use_agent_id: True

use_valuenorm: True
use_huber_loss: True
huber_delta: 10.0
use_policy_active_masks: True
use_value_active_masks: True
use_clipped_value_loss: True

use_linear_lr_decay: True
actor_min_lr_ratio: 0.1
critic_min_lr_ratio: 1.0
target_kl: 0.02

ppo_epochs: 6
ppo_clip_param: 0.2
value_clip_param: 0.2
gae_lambda: 0.95
entropy_coef: 0.02
value_coef: 1.0
critic_hidden_dim: 256

lr: 0.0004
critic_lr: 0.0007
optim_eps: 0.00001
grad_norm_clip: 5

t_max: 1500000

save_model: True
save_model_interval: 25000

init_checkpoint_path: ""
init_load_step: 0
init_load_strict: False
init_load_actor: True
init_load_critic: True
init_load_value_norm: True
init_test_nepisode: 0

name: "vanilla_mappo_sc2_5m6m_microcomm_v7_igg_move_selective_softgain_robust_g5_delta_random_init_open_gate"
