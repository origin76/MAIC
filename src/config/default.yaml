# --- Defaults ---

# --- pymarl options ---
runner: "episode" # Runs 1 env for an episode
mac: "basic_mac" # Basic controller
env: "sc2" # Environment name
env_args: {} # Arguments for the environment
batch_size_run: 1 # Number of environments to run in parallel
test_nepisode: 20 # Number of episodes to test for
test_interval: 2000 # Test after {} timesteps have passed
test_greedy: True # Use greedy evaluation (if False, will set epsilon floor to 0
log_interval: 2000 # Log summary of stats after every {} timesteps
runner_log_interval: 2000 # Log runner stats (not test stats) every {} timesteps
learner_log_interval: 2000 # Log training stats every {} timesteps
t_max: 10000 # Stop running after this many timesteps
use_cuda: True # Use gpu by default unless it isn't available
buffer_cpu_only: True # If true we won't keep all of the replay buffer in vram

# --- dmaq hyperparamter ---
is_save_buffer: False
save_buffer_size: 10000
save_buffer_interval: 1000
is_batch_rl: False
load_buffer_id: 0
save_buffer_id: 0
is_from_start: True
num_circle: 1
burn_in_period: 32

# --- Logging options ---
use_tensorboard: True # Log results to tensorboard
save_model: False # Save the models to disk
save_model_interval: 2000000 # Save models after this many timesteps
checkpoint_path: "" # Load a checkpoint from this path
init_checkpoint_path: "" # Initialize model weights from this checkpoint path without resuming training progress
evaluate: False # Evaluate model for test_nepisode episodes and quit (no training)
# Eval-only diagnostic: force communication fusion gates to 1.0 (if supported by the agent).
eval_force_comm_gate_open: False
# Eval-only diagnostic: force communication fusion gates to 0.0 (if supported by the agent).
eval_force_comm_gate_closed: False
# Eval-only diagnostic: forbid selecting the no-comm attention token (if supported by the agent).
eval_disable_no_comm_token: False
# Eval-only diagnostic: disable only the attack communication stream.
eval_disable_attack_comm: False
# Eval-only diagnostic: disable only the move communication stream.
eval_disable_move_comm: False
# Eval-only diagnostic: log peer-vs-local attack target causal statistics.
eval_peer_local_diagnostic: False

# Communication ablations/regularizers (optional, agent-specific).
attack_no_comm_score_penalty: 0.0
# Budget-aware "silence" constraint: treat selecting the no-comm token as
# consuming a limited "silence budget". These are aliases for the legacy
# *_no_comm_target knobs and keep Sacred CLI overrides from erroring.
no_comm_budget: null
no_comm_budget_loss_weight: null
attack_no_comm_budget: null
attack_no_comm_budget_loss_weight: null
attack_no_comm_target: null
attack_no_comm_target_loss_weight: 0.0
attack_entropy_target: null
attack_entropy_target_loss_weight: 0.0
attack_entropy_upper_only: True
attack_entropy_can_attack_only: True
attack_intent_align_loss_weight: 0.0
attack_intent_align_conf_threshold: 0.35
attack_intent_align_real_mass_threshold: 0.05
attack_intent_align_can_attack_only: True
attack_intent_align_detach_target: True
attack_intent_align_filter_mode: "all"
attack_msg_interp_enabled: False
attack_delta_l2_weight: 0.001
attack_intent_align_local_conf_threshold: 0.45
attack_intent_align_local_entropy_threshold: 0.0
attack_intent_align_soft_min_weight: 0.2
attack_adv_leverage_loss_weight: 0.0
attack_adv_leverage_margin: 0.03
attack_adv_leverage_adv_clip: 2.0
attack_adv_leverage_use_real_comm_weight: True
attack_adv_leverage_fixed_denom: True
attack_adv_leverage_loss_mode: "squared"
attack_adv_leverage_huber_beta: 0.03
attack_causal_leverage_loss_weight: 0.0
attack_causal_leverage_margin: 0.02
attack_causal_leverage_huber_beta: 0.02
attack_causal_leverage_adv_clip: 2.0
attack_causal_leverage_use_real_comm_weight: True
attack_causal_leverage_fixed_denom: True
attack_causal_local_target_prob_threshold: 0.35
attack_causal_peer_support_threshold: 0.25
attack_causal_stability_loss_weight: 0.0
attack_causal_bad_loss_weight: 0.0
attack_causal_bad_margin: 0.02
attack_causal_bad_huber_beta: 0.02
attack_causal_bad_adv_clip: 2.0
attack_causal_bad_peer_support_threshold: 0.55
attack_causal_bad_peer_boost_weight: 0.5
attack_peer_conflict_margin_leverage_loss_weight: 0.0
attack_peer_conflict_attack_only_margin_loss_weight: 0.0
attack_peer_conflict_margin: 0.03
attack_peer_conflict_margin_huber_beta: 0.02
attack_peer_conflict_peer_support_threshold: 0.7
attack_peer_conflict_use_real_comm_weight: True
attack_peer_conflict_fixed_denom: True
attack_peer_conflict_fused_local_conf_max: null
attack_peer_conflict_fused_local_uncertainty_min_weight: 0.2

move_no_comm_budget: null
move_no_comm_budget_loss_weight: null
move_no_comm_target: null
move_no_comm_target_loss_weight: 0.0
attack_attn_temperature: 1.0
attack_attn_score_clip: null
move_attn_score_clip: null

# IGG / counterfactual usegate options (optional, learner-specific).
counterfactual_usegate_overpredict_only_negative: False
counterfactual_usegate_overpredict_soft_weighting: False
load_step: 0 # Load model trained on this many timesteps (0 if choose max possible)
init_load_step: 0 # Choose timestep from init_checkpoint_path (0 if choose max possible)
init_load_strict: False # Whether initialization loading should require an exact state_dict match
init_load_actor: True # Load actor/mac weights during initialization
init_load_critic: True # Load critic weights during initialization
init_load_value_norm: True # Load value normalizer stats during initialization when available
init_test_nepisode: 64 # Number of episodes for the one-shot evaluation right after init_checkpoint_path loading (0 disables it)
save_replay: False # Saving the replay of the model loaded from checkpoint_path
local_results_path: "results" # Path for local results

# --- RL hyperparameters ---
gamma: 0.99
batch_size: 32 # Number of episodes to train on
buffer_size: 32 # Size of the replay buffer
lr: 0.0005 # Learning rate for agents
critic_lr: 0.0005 # Learning rate for critics
optim_alpha: 0.99 # RMSProp alpha
optim_eps: 0.00001 # RMSProp epsilon
grad_norm_clip: 10 # Reduce magnitude of gradients above this L2 norm

# --- Agent parameters ---
agent: "rnn" # Default rnn agent
rnn_hidden_dim: 64 # Size of hidden state for default rnn agent
obs_agent_id: True # Include the agent's one_hot id in the observation
obs_last_action: True # Include the agent's last action (one_hot) in the observation

# --- Experiment running params ---
repeat_id: 1
label: "default_label"
